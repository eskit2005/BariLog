spring:
  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration

  application:
    name: barilog-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bariLog}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 600       # 10 minutes (in seconds)
    refreshTokenExpiration: 604800   # 7 days (in seconds)

server:
  port: ${PORT:8080}
