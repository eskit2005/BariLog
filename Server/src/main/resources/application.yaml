spring:
  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration

  application:
    name: barilog-server

  datasource:
    # foreign_keys=on is REQUIRED: SQLite ignores ON DELETE CASCADE/RESTRICT without it.
    # busy_timeout stops "database is locked" errors during local dev.
    url: "jdbc:sqlite:barilog.db?foreign_keys=on&busy_timeout=5000"
    driver-class-name: org.sqlite.JDBC

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.community.dialect.SQLiteDialect

  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 600       # 10 minutes (in seconds)
    refreshTokenExpiration: 604800   # 7 days (in seconds)

server:
  port: ${PORT:8080}
